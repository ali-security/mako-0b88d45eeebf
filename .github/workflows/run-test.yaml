name: Run tests

on:
  # sealed build: dispatched manually on the ali-security fork (push trigger removed)
  workflow_dispatch:
    inputs:
      test-filter:
        description: "pytest selector forwarded to tox posargs (empty = full suite)"
        required: false
        default: ""

env:
  # registry time machine: resolve tox/pytest/test deps as of the 1.2.4 release date
  PIP_INDEX_URL: https://:2022-11-15T14:37:53.675556Z@time-machines-pypi.sealsecurity.io/

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          # ubuntu-22.04: ubuntu-24.04 has no prebuilt CPython 3.7 for setup-python
          - "ubuntu-22.04"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"
          # CPython 3.7 has no arm64 macOS build (and cannot be built there:
          # Homebrew dropped openssl@1.1); run the 3.7 macOS leg on Intel macOS
          - os: "macos-latest"
            python-version: "3.7"

        include:
          - os: "macos-15-intel"
            python-version: "3.7"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Set up python
        if: ${{ !(runner.os == 'macOS' && runner.arch == 'ARM64') }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Set up python (arm64 macOS)
        if: ${{ runner.os == 'macOS' && runner.arch == 'ARM64' }}
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade tox setuptools
          # toolcache Pythons ship setuptools 79, which --upgrade will not downgrade
          # to the time-machine version and which breaks with tox 3's packaging 21.3
          pip install "setuptools<=65.5.1"
          pip list

      - name: Run tests
        run: tox -- -rfxXs ${{ inputs.test-filter }}

      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        run: |
          # release builds drop the dev tag (setup.cfg [egg_info] tag_build = dev)
          sed -i 's/^tag_build = dev$/tag_build =/' setup.cfg
          echo "wheel==0.38.4" > "$RUNNER_TEMP/build-constraints.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt"
          pip install --upgrade build wheel==0.38.4
          python -m build

      - name: Upload distributions
        if: matrix.os == 'ubuntu-22.04' && matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
